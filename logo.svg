<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A3D9A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#342878;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Purple background — full viewBox, rounded corners -->
  <rect width="360" height="80" rx="6" ry="6" fill="url(#purpleGrad)"/>

  <!-- Subtle inner border line -->
  <rect x="8" y="8" width="344" height="64" rx="4" ry="4"
    fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Left decorative accent -->
  <rect x="16" y="14" width="2.5" height="52" fill="rgba(255,255,255,0.25)" rx="1"/>

  <!-- "Aashiyana" italic serif -->
  <text x="27" y="42"
    font-family="Georgia, 'Palatino Linotype', serif"
    font-size="30"
    font-weight="700"
    font-style="italic"
    fill="white"
    letter-spacing="1">Aashiyana</text>

  <!-- "Decor" bold upright -->
  <text x="196" y="42"
    font-family="'Arial Black', Arial, Helvetica, sans-serif"
    font-size="26"
    font-weight="900"
    fill="white"
    letter-spacing="0.5">Decor</text>

  <!-- "(For Stylish Living)" gold italic -->
  <text x="27" y="63"
    font-family="Georgia, serif"
    font-size="12"
    font-style="italic"
    fill="#F5C518"
    letter-spacing="0.5">(For Stylish Living)</text>

  <!-- Tagline right-aligned -->
  <text x="344" y="63"
    font-family="Arial, Helvetica, sans-serif"
    font-size="8"
    fill="rgba(255,255,255,0.45)"
    font-weight="600"
    text-anchor="end"
    letter-spacing="1.2">MARBLE · GRANITE · TILES · QUARTZ</text>
</svg>
